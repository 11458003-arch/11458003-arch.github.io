<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>計算天數</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 760px;
      margin: 20px auto;
      padding: 0 16px;
      line-height: 1.5;
      background: #FFB6C1;
      color: #DC143C;
    }
    h1 { font-size: 24px; margin-bottom: 16px; color: #DC143C; }
    .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #DC143C; }
    input { width: 100%; padding: 8px; border: 2px solid #DC143C; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
    button { padding: 10px 20px; background: #DC143C; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background: #B22222; }
    .result { margin-top: 20px; padding: 16px; background: #FFE4E1; border-left: 4px solid #DC143C; border-radius: 4px; }
    .result-text { font-size: 18px; font-weight: bold; color: #DC143C; }
    .videos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 16px; }
    .video-item { background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .video-item h3 { color: #DC143C; margin: 0 0 12px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div style="text-align: center; margin-bottom: 24px; font-size: 24px;">
      <div style="color: #DC143C; font-weight: bold; letter-spacing: 2px;">Yi chun ❤️ Peichen</div>
      <div id="loveInfo" style="color:#B22222; margin-top:8px; font-size:16px;">我們相愛的那一天：2026-05-23 ・ 經過 0 天</div>
    </div>
    <h1>計算天數</h1>
    
    <div style="text-align:center; margin:8px 0 12px 0;">
      <div style="font-size:14px;color:#B22222;">固定開始時間：2026-05-23</div>
      <button onclick="calculateDays()" style="margin-top:8px;padding:8px 12px;background:#DC143C;color:#fff;border:none;border-radius:4px;">顯示已過天數</button>
    </div>
    
    <div id="resultDiv" style="display:none;" class="result">
      <div class="result-text" id="resultText"></div>
    </div>

    <hr style="margin: 32px 0; border: 1px solid #DC143C;">

    <h2 style="color: #DC143C; margin-top: 32px;">影片集</h2>
    <div style="text-align:center; margin:10px 0 0 0;">
      <button id="autoplayBtn" style="padding:8px 12px; background:#DC143C; color:#fff; border:none; border-radius:4px; cursor:pointer;">一鍵自動播放（靜音）</button>
      <button id="unmuteBtn" style="padding:8px 12px; margin-left:8px; background:#fff; color:#DC143C; border:2px solid #DC143C; border-radius:4px; cursor:pointer;">解除靜音並播放聲音</button>
    </div>
    <div class="videos-grid">
      <div class="video-item">
        <h3>影片 1</h3>
        <video controls playsinline muted poster="/assets/snake-thumb.svg" width="100%" height="auto" style="border-radius: 4px; border: 2px solid #DC143C;" preload="metadata">
          <source src="videos/1.mp4" type="video/mp4">
          您的瀏覽器不支援 HTML5 影片。
        </video>
        <div class="video-controls" style="margin-top:8px;">
          <a href="videos/1.mp4" target="_blank" rel="noopener" style="color:#DC143C;">在新分頁播放</a>
        </div>
      </div>
      <div class="video-item">
        <h3>影片 2</h3>
        <video controls playsinline muted poster="/assets/whac-a-mole-thumb.svg" width="100%" height="auto" style="border-radius: 4px; border: 2px solid #DC143C;" preload="metadata">
          <source src="videos/2.mp4" type="video/mp4">
          您的瀏覽器不支援 HTML5 影片。
        </video>
        <div class="video-controls" style="margin-top:8px;">
          <a href="videos/2.mp4" target="_blank" rel="noopener" style="color:#DC143C;">在新分頁播放</a>
        </div>
      </div>
      <div class="video-item">
        <h3>影片 3</h3>
        <video controls playsinline muted poster="/assets/snake-thumb.svg" width="100%" height="auto" style="border-radius: 4px; border: 2px solid #DC143C;" preload="metadata">
          <source src="videos/3.mp4" type="video/mp4">
          您的瀏覽器不支援 HTML5 影片。
        </video>
        <div class="video-controls" style="margin-top:8px;">
          <a href="videos/3.mp4" target="_blank" rel="noopener" style="color:#DC143C;">在新分頁播放</a>
        </div>
      </div>
    </div>
  </div>

    <script>
    // 設定今天日期為預設
    const today = new Date().toISOString().split('T')[0];
    // 固定開始時間為 2026-05-23
    const fixedStart = '2026-05-23';

    // 我們相愛的那一天（固定）
    const loveDateStr = '2026-05-23';
    function updateLoveInfo() {
      const loveElem = document.getElementById('loveInfo');
      if (!loveElem) return;
      const now = new Date();
      const loveDate = new Date(loveDateStr);
      // 計算整天差（不計時間），只比較年月日部分
      const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const loveMidnight = new Date(loveDate.getFullYear(), loveDate.getMonth(), loveDate.getDate());
      const diffDays = Math.floor((todayMidnight - loveMidnight) / (1000 * 60 * 60 * 24));
      const displayDays = diffDays >= 0 ? diffDays : 0;
      loveElem.textContent = `我們相愛的那一天：${loveDateStr} ・ 經過 ${displayDays} 天`;
    }

    updateLoveInfo();

    function calculateDays() {
      const startDate = new Date(fixedStart);
      const endDate = new Date();
      const timeDiff = endDate - startDate;
      const daysDiff = Math.floor(timeDiff / (1000 * 3600 * 24));

      const resultDiv = document.getElementById('resultDiv');
      const resultText = document.getElementById('resultText');
      resultText.textContent = `從 ${fixedStart} 到 ${today}，共經過 ${daysDiff + 1} 天`;
      resultDiv.style.display = 'block';
    }
  </script>

  <script>
    // 改善行動裝置 autoplay：嘗試啟動所有影片（靜音），並提供按鈕讓使用者手動觸發
    (function() {
      const videos = Array.from(document.querySelectorAll('.videos-grid video'));
      const btn = document.getElementById('autoplayBtn');

      async function tryAutoplayAll() {
        if (!videos.length) return;
        for (const v of videos) {
          try {
            v.muted = true;
            // 某些瀏覽器需要設定 playsinline 與 muted 才允許自動播放
            await v.play();
          } catch (e) {
            // 忽略播放錯誤（瀏覽器可能仍然阻擋自動播放）
          }
        }
        if (btn) btn.textContent = '已啟動（靜音）';
      }

      // 嘗試在載入後自動播放（多數行動裝置會允許靜音自動播放）
      window.addEventListener('load', () => {
        tryAutoplayAll();
      });

      if (btn) {
        btn.addEventListener('click', async () => {
          await tryAutoplayAll();
        });
      }

      // 解除靜音按鈕（需要使用者互動）
      const unmuteBtn = document.getElementById('unmuteBtn');
      async function unmuteAndPlay(targetIndex = 0) {
        if (!videos.length) return;
        // 解除靜音
        videos.forEach(v => v.muted = false);
        // 播放指定影片（或第一支）
        try {
          await videos[targetIndex].play();
        } catch (e) {
          // 若播放被阻擋，忽略
        }
      }

      if (unmuteBtn) {
        unmuteBtn.addEventListener('click', async () => {
          await unmuteAndPlay(0);
          unmuteBtn.textContent = '已解除靜音';
        });
      }

      // 點擊任一影片本體，也解除靜音並播放該影片（視為使用者互動）
      videos.forEach((v, idx) => {
        v.addEventListener('click', async () => {
          if (v.muted) {
            v.muted = false;
          }
          try { await v.play(); } catch (e) {}
        });
      });
    })();
  </script>
</body>
</html>
